<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amaira's Digital Portfolio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDKs (Removed Storage SDK, keeping core database and auth) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // 1. PASTE YOUR FIREBASE KEYS HERE
        const firebaseConfig = {
            apiKey: "AIzaSyDNP7Rc50smJ3QeAOZozQ7220CrjkEiEcY",
            authDomain: "amaira--digital-portfolio.firebaseapp.com",
            projectId: "amaira--digital-portfolio",
            storageBucket: "amaira--digital-portfolio.firebasestorage.app",

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Premium Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }

        /* Edit Mode Logic - Strict Hiding */
        .edit-controls-flex { display: none !important; }
        .edit-controls-block { display: none !important; }
        body.edit-mode .edit-controls-flex { display: flex !important; }
        body.edit-mode .edit-controls-block { display: block !important; }
        
        /* Editable Borders */
        body:not(.edit-mode) .editable-border { border: 1px solid transparent !important; pointer-events: none; }
        body.edit-mode .editable-border { border: 1px dashed #94a3b8 !important; border-radius: 0.5rem; transition: all 0.2s; }
        body.edit-mode .editable-border:focus { border-color: #2563eb !important; background: #f8fafc; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        /* Hide completely empty fields in view mode */
        body:not(.edit-mode) textarea:placeholder-shown,
        body:not(.edit-mode) input:placeholder-shown,
        body:not(.edit-mode) .hide-if-empty:empty,
        body:not(.edit-mode) .hide-if-no-media:not(:has(img)):not(:has(iframe)) { display: none !important; }

        /* Sidebar Desktop Transitions */
        #app-sidebar { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        #app-sidebar.collapsed { width: 5.5rem; }
        #app-sidebar.collapsed .hide-on-collapse { display: none; opacity: 0; }
        #app-sidebar.collapsed .center-on-collapse { justify-content: center; padding-left: 0; padding-right: 0; }
        
        /* Mobile Sidebar Drawer Logic */
        @media (max-width: 767px) {
            #app-sidebar { position: absolute; left: 0; top: 0; transform: translateX(-100%); width: 85vw !important; max-width: 320px; z-index: 50; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
            #app-sidebar.mobile-open { transform: translateX(0); }
            #app-sidebar .hide-on-collapse { display: block; opacity: 1; }
            #app-sidebar.collapsed { width: 85vw !important; }
            .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.4); z-index: 40; backdrop-filter: blur(3px); }
            .mobile-overlay.show { display: block; }
        }

        /* Toast Notifications */
        #toast-notification { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; transform: translateY(100px); opacity: 0; z-index: 99999; }
        #toast-notification.show { transform: translateY(0); opacity: 1; }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Premium Glass Effect */
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
    </style>
</head>

<body class="text-slate-800 flex h-screen overflow-hidden bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-100 via-slate-50 to-white selection:bg-blue-200">

    <!-- Mobile Overlay -->
    <div id="mobile-sidebar-overlay" class="mobile-overlay" onclick="toggleMobileMenu()"></div>

    <!-- Toast Notification -->
    <div id="toast-notification" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 text-sm font-medium border border-slate-700">
        <i class="fa-solid fa-circle-info text-blue-400" id="toast-icon"></i>
        <span id="toast-msg">Action successful</span>
    </div>

    <!-- Sidebar -->
    <aside id="app-sidebar" class="glass-card border-r border-slate-200/50 flex flex-col w-[19rem] flex-shrink-0 relative shadow-[4px_0_24px_rgba(37,99,235,0.05)] z-40">
        
        <!-- Profile Section -->
        <div class="p-6 flex flex-col items-center border-b border-slate-100/50 relative group">
            <button onclick="toggleSidebarCollapse()" class="hidden md:flex absolute -right-3.5 top-10 bg-white border border-blue-100 text-blue-500 hover:text-blue-700 hover:bg-blue-50 w-7 h-7 rounded-full items-center justify-center shadow-md z-10 transition-all">
                <i class="fa-solid fa-chevron-left text-[10px]" id="collapse-icon"></i>
            </button>
            
            <div class="relative cursor-pointer transition-transform hover:scale-105" onclick="handleThumbnailClick()">
                <img id="sidebar-profile-pic" src="https://ui-avatars.com/api/?name=Amaira+Mulay&background=bfdbfe&color=1e3a8a" class="w-20 h-20 rounded-[1.25rem] object-cover shadow-lg border-2 border-white" alt="Amaira">
                <div class="edit-controls-flex absolute inset-0 bg-black/40 rounded-[1.25rem] items-center justify-center opacity-0 group-hover:opacity-100 transition">
                    <i class="fa-solid fa-camera text-white text-lg"></i>
                </div>
            </div>
            <input type="file" id="profile_pic_input" class="hidden" accept="image/*" onchange="handleProfilePicUpload(event)">
            
            <div class="mt-4 text-center hide-on-collapse w-full min-w-0">
                <textarea rows="1" data-field="profile.name" class="w-full text-center text-xl font-extrabold text-slate-900 bg-transparent editable-border p-1 resize-none overflow-hidden" placeholder="Name">Amaira Mulay</textarea>
                <textarea rows="1" data-field="profile.grade" class="w-full text-center text-xs font-bold text-blue-600 uppercase tracking-widest bg-transparent editable-border p-1 resize-none overflow-hidden mt-0.5" placeholder="Grade">Class 6 • NVS</textarea>
            </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="flex-1 overflow-y-auto p-4 space-y-1 scroll-smooth" id="sidebar-nav">
            <!-- Rendered by JS -->
        </nav>

        <!-- Admin Control Footer -->
        <div class="p-4 border-t border-slate-100/50 bg-white/50 flex flex-col space-y-2">
            <button onclick="handleAdminLoginToggle()" id="edit-mode-btn" class="w-full flex items-center justify-center space-x-2 py-3 px-4 rounded-xl bg-slate-100/80 text-slate-500 font-bold text-sm transition-all hover:bg-slate-200 shadow-sm">
                <i class="fa-solid fa-lock"></i>
                <span class="hide-on-collapse">Admin Login</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative min-w-0">
        
        <!-- Top Header -->
        <header class="h-16 glass-card border-b border-slate-200/50 px-4 md:px-8 flex items-center justify-between flex-shrink-0 z-10 relative">
            <div class="flex items-center space-x-3 min-w-0">
                <button onclick="toggleMobileMenu()" class="md:hidden flex items-center justify-center w-10 h-10 text-slate-600 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition flex-shrink-0">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-100 to-blue-50 flex items-center justify-center text-blue-600 flex-shrink-0 shadow-inner">
                    <i id="header-icon" class="fa-solid fa-folder-open text-sm"></i>
                </div>
                <h2 id="current-page-title" class="text-lg md:text-xl font-extrabold text-slate-800 tracking-tight truncate min-w-0">About Me</h2>
            </div>
            
            <div class="flex items-center space-x-3 edit-controls-flex flex-shrink-0" id="sync-status-container">
                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full border border-blue-200 flex items-center space-x-1.5 whitespace-nowrap shadow-sm">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span class="hidden sm:inline">Synced</span>
                </span>
            </div>
        </header>

        <!-- Dynamic Viewport -->
        <div id="main-content-viewport" class="flex-1 overflow-y-auto overflow-x-hidden p-4 md:p-8 lg:p-10 fade-in scroll-smooth">
            <!-- Content Injected via JS -->
        </div>
    </main>

    <script>
        let state = {
            isEditMode: false,
            isSidebarCollapsed: false,
            currentView: 'about',
            activeIds: { classId: null, subjectId: null, category: null },
            collapsedMenus: { classes: {}, categories: {} },
            
            profile: { name: 'Amaira Mulay', grade: 'Class 6 • NVS', pic: '' },
            about: { 
                title: 'Hello! I am Amaira.', 
                subtitle: 'Welcome to my digital portfolio!', 
                bio: 'I am an enthusiastic 6th-grade student at Nath Valley School in Chhatrapati Sambhajinagar. I love exploring the wonders of Science, participating in school activities, and learning new skills every day! I hope you like my digital portfolio, which will give you a brief about my academics as well as my extra-curricular activities and hobbies.',
                media: [] 
            },
            classes: [
                {
                    id: 'class_6', name: 'Class 6 (2026-27)', year: '2026-2027',
                    subjects: [
                        {
                            id: 'sub_science', name: 'Science & MDP', description: 'Exploring the world of Science and hands-on multi-disciplinary projects.',
                            projects: [
                                { title: 'Monginis Factory Visit', desc: 'Educational field trip to understand industrial baking, temperature control, and food hygiene standards. We observed the massive ovens and automated mixing machines!', media: [] }
                            ]
                        }
                    ]
                }
            ],
            categoryNames: {
                extracurriculars: 'Extracurriculars',
                hobbies: 'Hobbies & Skills',
                achievements: 'Achievements',
                photoFeed: 'My Memories'
            },
            extracurriculars: { 'class_6': [] },
            hobbies: { 'class_6': [] },
            achievements: { 'class_6': [] },
            photoFeed: { 'class_6': [] }
        };

        const DOC_ID = "AMAIRA_PORTFOLIO_MASTER_DATA_V4";

        auth.onAuthStateChanged(user => {
            if (user) {
                state.isEditMode = true;
            } else {
                state.isEditMode = false;
            }
            loadFromFirebase(); 
            updateEditModeUI();
        });

        async function loadFromFirebase() {
            try {
                const docRef = db.collection('portfolioData').doc(DOC_ID);
                const docSnap = await docRef.get();
                if (docSnap.exists) {
                    let dbData = docSnap.data();
                    ['extracurriculars', 'hobbies', 'achievements', 'photoFeed'].forEach(cat => {
                        if (dbData[cat] && Array.isArray(dbData[cat])) {
                            let migrated = {};
                            const defaultClassId = dbData.classes && dbData.classes.length > 0 ? dbData.classes[0].id : 'class_6';
                            migrated[defaultClassId] = dbData[cat];
                            dbData[cat] = migrated;
                        }
                    });
                    state = { ...state, ...dbData };
                }
                renderApp();
            } catch (e) {
                console.error("Error loading data:", e);
                renderApp(); 
            }
        }

        let saveTimeout;
        function triggerSave() {
            if (!auth.currentUser) return; 
            clearTimeout(saveTimeout);
            
            const syncContainer = document.getElementById('sync-status-container');
            if(syncContainer) syncContainer.innerHTML = `<span class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200 flex items-center space-x-1.5 whitespace-nowrap shadow-sm"><i class="fa-solid fa-spinner animate-spin"></i><span class="hidden sm:inline">Saving...</span></span>`;

            saveTimeout = setTimeout(async () => { 
                try { 
                    await db.collection('portfolioData').doc(DOC_ID).set(state); 
                    if(syncContainer) syncContainer.innerHTML = `<span class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full border border-blue-200 flex items-center space-x-1.5 whitespace-nowrap shadow-sm"><i class="fa-solid fa-cloud-arrow-up"></i><span class="hidden sm:inline">Synced</span></span>`;
                } 
                catch (e) { 
                    console.error("Cloud Save Error:", e);
                    alert("⚠️ CLOUD SAVE FAILED: " + e.message + "\n\nIf you see a size limit error, delete 1 or 2 old photos first so the database un-jams!");
                    if(syncContainer) syncContainer.innerHTML = `<span class="text-xs font-bold text-rose-600 bg-rose-50 px-3 py-1.5 rounded-full border border-rose-200 flex items-center space-x-1.5 whitespace-nowrap shadow-sm"><i class="fa-solid fa-triangle-exclamation"></i><span class="hidden sm:inline">Failed</span></span>`;
                }
            }, 500);
        }

        async function handleAdminLoginToggle() {
            if (auth.currentUser) {
                await auth.signOut();
                showToast("Logged out successfully");
            } else {
                const email = prompt("Admin Email:");
                if(!email) return;
                const pass = prompt("Admin Password:");
                if(!pass) return;
                try {
                    await auth.signInWithEmailAndPassword(email, pass);
                    showToast("Admin access granted");
                } catch (e) {
                    alert("Login failed: " + e.message);
                }
            }
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('app-sidebar');
            const overlay = document.getElementById('mobile-sidebar-overlay');
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('show');
        }

        function toggleSidebarCollapse() {
            state.isSidebarCollapsed = !state.isSidebarCollapsed;
            const sidebar = document.getElementById('app-sidebar');
            const icon = document.getElementById('collapse-icon');
            sidebar.classList.toggle('collapsed', state.isSidebarCollapsed);
            icon.className = state.isSidebarCollapsed ? "fa-solid fa-chevron-right text-[10px]" : "fa-solid fa-chevron-left text-[10px]";
            renderSidebarNav();
        }

        function handleThumbnailClick() {
            if (state.isSidebarCollapsed && window.innerWidth >= 768) toggleSidebarCollapse(); 
            else if (auth.currentUser) document.getElementById('profile_pic_input').click();
        }

        function handleIconClick(e, actionFn) {
            if (state.isSidebarCollapsed && window.innerWidth >= 768) toggleSidebarCollapse();
            actionFn();
        }

        function toggleMenuSection(type, id) {
            if (state.isSidebarCollapsed && window.innerWidth >= 768) toggleSidebarCollapse();
            state.collapsedMenus[type][id] = !state.collapsedMenus[type][id];
            renderSidebarNav();
        }

        function switchView(viewName, classId = null, subjectId = null, category = null) {
            state.currentView = viewName;
            state.activeIds = { classId, subjectId, category };
            if (window.innerWidth < 768) {
                document.getElementById('app-sidebar').classList.remove('mobile-open');
                document.getElementById('mobile-sidebar-overlay').classList.remove('show');
            }
            renderApp();
        }

        function updateEditModeUI() {
            document.body.classList.toggle('edit-mode', state.isEditMode);
            const btn = document.getElementById('edit-mode-btn');
            if (auth.currentUser) {
                btn.innerHTML = `<i class="fa-solid fa-lock-open text-blue-500"></i><span class="hide-on-collapse">Admin: ON (Logout)</span>`;
                btn.className = "w-full flex items-center justify-center space-x-2 py-3 px-4 rounded-xl bg-blue-50 text-blue-600 border border-blue-200 font-bold text-sm shadow-sm transition";
            } else {
                btn.innerHTML = `<i class="fa-solid fa-lock"></i><span class="hide-on-collapse">Admin Login</span>`;
                btn.className = "w-full flex items-center justify-center space-x-2 py-3 px-4 rounded-xl bg-slate-100 text-slate-500 font-bold text-sm hover:bg-slate-200 transition";
            }
        }

        function showToast(msg, iconClass = "fa-circle-info", iconColor = "text-blue-400") {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').className = `fa-solid ${iconClass} ${iconColor}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function attachInputListeners() {
            document.querySelectorAll('textarea[data-field], input[data-field]').forEach(input => {
                if(input.tagName === 'TEXTAREA') {
                    autoResizeTextarea(input);
                    input.addEventListener('input', function() { autoResizeTextarea(this); });
                }
                
                input.addEventListener('input', (e) => {
                    if (!auth.currentUser) return;
                    const field = e.target.dataset.field;
                    const val = e.target.value;
                    const ids = e.target.dataset.ids ? e.target.dataset.ids.split(',') : [];

                    if (field.startsWith('profile.')) state.profile[field.split('.')[1]] = val;
                    else if (field.startsWith('about.')) state.about[field.split('.')[1]] = val;
                    else if (field === 'class.name') state.classes.find(c => c.id === ids[0]).name = val;
                    else if (field === 'subject.name') state.classes.find(c => c.id === ids[0]).subjects.find(s => s.id === ids[1]).name = val;
                    else if (field === 'subject.desc') state.classes.find(c => c.id === ids[0]).subjects.find(s => s.id === ids[1]).description = val;
                    else if (field === 'project.title') state.classes.find(c => c.id === ids[0]).subjects.find(s => s.id === ids[1]).projects[ids[2]].title = val;
                    else if (field === 'project.desc') state.classes.find(c => c.id === ids[0]).subjects.find(s => s.id === ids[1]).projects[ids[2]].desc = val;
                    else if (field === 'category.name') state.categoryNames[ids[0]] = val;
                    else if (field === 'generic.title') state[ids[0]][ids[1]][ids[2]].title = val;
                    else if (field === 'generic.desc') state[ids[0]][ids[1]][ids[2]].desc = val;
                    
                    document.querySelectorAll(`[data-sync="${field}_${ids.join('_')}"]`).forEach(el => el.innerText = val);
                    triggerSave();
                });
            });
        }

        function renderSidebarNav() {
            const nav = document.getElementById('sidebar-nav');
            let html = `
                <div onclick="handleIconClick(event, () => switchView('about'))" class="flex items-center space-x-3 p-3 rounded-xl cursor-pointer transition ${state.currentView === 'about' ? 'bg-blue-600 shadow-md text-white font-bold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'} center-on-collapse">
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 ${state.currentView === 'about' ? 'text-white' : 'bg-white shadow-sm text-slate-500'}"><i class="fa-solid fa-user text-sm"></i></div>
                    <span class="text-sm truncate hide-on-collapse">About Me</span>
                </div>
            `;

            // Academics
            html += `<div class="mt-6 mb-2 px-3 text-[10px] font-extrabold text-blue-400 uppercase tracking-widest hide-on-collapse">Academics</div>`;
            state.classes.forEach((cls) => {
                const isCollapsed = state.collapsedMenus['classes'][cls.id];
                html += `
                    <div class="mt-1 min-w-0">
                        <div class="flex items-center justify-between p-2 cursor-pointer group center-on-collapse hover:bg-white rounded-xl transition shadow-sm" onclick="handleIconClick(event, () => toggleMenuSection('classes', '${cls.id}'))">
                            <div class="flex items-center space-x-3 w-full min-w-0 hide-on-collapse pl-1">
                                <i class="fa-solid fa-graduation-cap text-xs text-blue-500"></i>
                                <textarea rows="1" data-field="class.name" data-ids="${cls.id}" class="w-full text-sm font-bold text-slate-700 bg-transparent editable-border p-1 resize-none overflow-hidden" onclick="event.stopPropagation()">${cls.name}</textarea>
                            </div>
                            <i class="fa-solid fa-chevron-${isCollapsed ? 'down' : 'up'} text-[10px] text-slate-400 group-hover:text-blue-500 hide-on-collapse transition ml-2 mr-2"></i>
                            <div class="hidden md:flex flex-col items-center justify-center w-full ${state.isSidebarCollapsed ? '!flex' : '!hidden'}">
                                <div class="w-8 h-8 rounded-lg flex items-center justify-center bg-white shadow-sm text-blue-500"><i class="fa-solid fa-graduation-cap text-sm"></i></div>
                            </div>
                        </div>
                        <div class="space-y-1 mt-1 ${isCollapsed ? 'hidden' : 'block'} min-w-0">
                `;

                cls.subjects.forEach(sub => {
                    const isActive = state.activeIds.subjectId === sub.id;
                    html += `
                        <div onclick="switchView('subject', '${cls.id}', '${sub.id}')" class="flex items-center space-x-3 p-2.5 rounded-xl cursor-pointer transition ${isActive ? 'bg-blue-50 text-blue-700 font-bold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'} center-on-collapse ml-3 min-w-0">
                            <i class="fa-solid fa-book-open text-[10px] ${isActive ? 'text-blue-600' : 'text-slate-300'} flex-shrink-0"></i>
                            <span class="text-xs truncate hide-on-collapse min-w-0" data-sync="subject.name_${cls.id}_${sub.id}">${sub.name}</span>
                        </div>
                    `;
                });

                html += `
                    <button onclick="addSubject('${cls.id}')" class="edit-controls-flex items-center space-x-2 text-xs font-bold text-blue-500 hover:text-blue-700 p-2 ml-3 mt-1 hide-on-collapse flex-shrink-0">
                        <i class="fa-solid fa-plus"></i><span>Add Subject</span>
                    </button>
                </div></div>`;
            });
            
            html += `<button onclick="addClass()" class="edit-controls-flex w-full items-center justify-center space-x-2 text-xs font-bold text-emerald-600 bg-emerald-50 hover:bg-emerald-100 py-2 mt-3 rounded-xl hide-on-collapse transition">
                        <i class="fa-solid fa-plus"></i><span>Add Grade / Class</span>
                     </button>`;

            // Beyond Academics
            html += `<div class="mt-6 mb-2 px-3 text-[10px] font-extrabold text-blue-400 uppercase tracking-widest hide-on-collapse">Beyond Academics</div>`;
            ['extracurriculars', 'hobbies', 'achievements', 'photoFeed'].forEach(cat => {
                const icon = cat === 'photoFeed' ? 'fa-images' : (cat === 'achievements' ? 'fa-trophy' : (cat === 'hobbies' ? 'fa-palette' : 'fa-medal'));
                const iconColor = cat === 'photoFeed' ? 'text-pink-500' : (cat === 'achievements' ? 'text-amber-500' : (cat === 'hobbies' ? 'text-purple-500' : 'text-emerald-500'));
                const isCatCollapsed = state.collapsedMenus['categories'][cat];
                const isActiveCat = state.currentView === 'category' && state.activeIds.category === cat;

                html += `
                    <div class="mt-1 min-w-0">
                        <div class="flex items-center justify-between p-2 cursor-pointer group center-on-collapse hover:bg-white rounded-xl transition shadow-sm ${isActiveCat ? 'bg-white' : ''}" onclick="handleIconClick(event, () => toggleMenuSection('categories', '${cat}'))">

        function renderCarousel(mediaArr, context, inputId) {
            if (!mediaArr || mediaArr.length === 0) {
                return `
                    <div class="edit-controls-flex w-full h-full min-h-[250px] border-2 border-dashed border-blue-200 rounded-[2rem] items-center justify-center bg-blue-50/50 cursor-pointer hover:bg-blue-50 transition m-4 mx-auto max-w-[90%]" onclick="document.getElementById('${inputId}').click()">
                        <div class="text-center text-blue-400"><i class="fa-solid fa-cloud-arrow-up text-4xl mb-3"></i><p class="text-sm font-bold">Upload Photos or Add Video</p></div>
                    </div>`;
            }

            const currentIdx = state[`idx_${context}`] || 0;
            const currentItem = mediaArr[currentIdx];
            const safeImages = JSON.stringify(mediaArr).replace(/"/g, "&quot;");
            
            let mediaDisplayHtml = '';
            if (typeof currentItem === 'object' && currentItem.type === 'video') {
                mediaDisplayHtml = `<iframe class="absolute inset-0 w-full h-full object-cover" src="${currentItem.url}" frameborder="0" allowfullscreen></iframe>`;
            } else {
                const imgSrc = typeof currentItem === 'string' ? currentItem : currentItem.url;
                mediaDisplayHtml = `
                    <div class="absolute inset-0 w-full h-full flex items-center justify-center overflow-hidden bg-slate-900">
                        <div class="absolute inset-0 bg-cover bg-center blur-2xl opacity-40 scale-125" style="background-image: url('${imgSrc}')"></div>
                        <img src="${imgSrc}" class="carousel-img relative max-w-full max-h-full object-contain z-10 p-3 transition-all duration-700 ease-in-out">
                    </div>
                `;
            }

            return `
                <div class="carousel-container relative w-full h-full min-h-[300px] md:min-h-full group rounded-t-[2.5rem] md:rounded-l-[2.5rem] md:rounded-tr-none overflow-hidden bg-slate-900" data-context="${context}" data-images="${safeImages}" data-index="${currentIdx}">
                    ${mediaDisplayHtml}
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
                    
                    <div class="edit-controls-flex absolute top-4 right-4 space-x-2 z-20">
                        <button onclick="document.getElementById('${inputId}').click()" class="bg-white text-blue-600 w-10 h-10 rounded-xl shadow-lg flex items-center justify-center hover:scale-105 transition" title="Add Photo"><i class="fa-solid fa-camera text-sm"></i></button>
                        <button onclick="removeMedia('${context}')" class="bg-white text-rose-500 w-10 h-10 rounded-xl shadow-lg flex items-center justify-center hover:scale-105 transition" title="Remove"><i class="fa-solid fa-trash text-sm"></i></button>
                    </div>
                    
                    ${mediaArr.length > 1 ? `
                        <button onclick="manualChangeSlide('${context}', -1)" class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/40 text-white w-10 h-10 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition backdrop-blur-md hover:bg-black/60 z-20"><i class="fa-solid fa-chevron-left text-sm"></i></button>
                        <button onclick="manualChangeSlide('${context}', 1)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/40 text-white w-10 h-10 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition backdrop-blur-md hover:bg-black/60 z-20"><i class="fa-solid fa-chevron-right text-sm"></i></button>
                        <div class="carousel-dots absolute bottom-4 left-0 right-0 flex justify-center space-x-2 z-20">
                            ${mediaArr.map((_, i) => `<div class="carousel-dot w-2 h-2 rounded-full transition-all duration-300 ${i === currentIdx ? 'bg-white scale-125' : 'bg-white/40'}" data-index="${i}"></div>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        setInterval(() => {
            if(state.isEditMode) return;
            document.querySelectorAll('.carousel-container').forEach(container => {
                try {
                    const imagesStr = container.getAttribute('data-images');
                    if(!imagesStr) return;
                    
                    const images = JSON.parse(imagesStr.replace(/&quot;/g, '"'));
                    if (images.length > 1) {
                        let idx = parseInt(container.getAttribute('data-index'));
                        idx = (idx + 1) % images.length;
                        
                        container.setAttribute('data-index', idx);
                        const currentItem = images[idx];
                        
                        if (typeof currentItem === 'object' && currentItem.type === 'video') {
                            container.innerHTML = renderCarousel(images, container.getAttribute('data-context'), 'temp_input');
                        } else {
                            const imgEl = container.querySelector('.carousel-img');
                            if(imgEl) {
                                imgEl.style.opacity = '0.7';
                                setTimeout(() => {
                                    imgEl.src = typeof currentItem === 'string' ? currentItem : currentItem.url;
                                    imgEl.style.opacity = '1';
                                }, 150);
                            }
                        }
                        
                        const dots = container.querySelectorAll('.carousel-dot');
                        dots.forEach((dot, i) => {
                            dot.className = `carousel-dot w-2 h-2 rounded-full transition-all duration-300 ${i === idx ? 'bg-white scale-125' : 'bg-white/40'}`;
                        });
                        
                        const context = container.getAttribute('data-context');
                        state[`idx_${context}`] = idx;
                    }
                } catch(e) { console.error("Slideshow error", e); }
            });
        }, 5000);

        function manualChangeSlide(context, dir) {
            const el = document.querySelector(`[data-context="${context}"]`);
            if(!el) return;
            const images = JSON.parse(el.getAttribute('data-images').replace(/&quot;/g, '"'));
            
            let curr = state[`idx_${context}`] || 0;
            curr = (curr + dir + images.length) % images.length;
            state[`idx_${context}`] = curr;
            renderApp();
        }

        function removeMedia(context) {
            const idx = state[`idx_${context}`] || 0;
            if (context === 'about.media') {
                state.about.media.splice(idx, 1);
                state['idx_about.media'] = 0;
            } else if (context.startsWith('project.')) {
                const cleanContext = context.replace('project.', '');
                const lastUnderscore = cleanContext.lastIndexOf('_');
                const parentPath = cleanContext.substring(0, lastUnderscore);
                const pIdx = parseInt(cleanContext.substring(lastUnderscore + 1));
                
                const firstUnderscore = parentPath.indexOf('_');
                const classId = parentPath.substring(0, firstUnderscore);
                const subjectId = parentPath.substring(firstUnderscore + 1);
                
                const cls = state.classes.find(c => c.id === classId);
                if (cls) {
                    const sub = cls.subjects.find(s => s.id === subjectId);
                    if (sub && sub.projects && sub.projects[pIdx]) {
                        sub.projects[pIdx].media.splice(idx, 1);
                        state[`idx_${context}`] = 0;
                    }
                }
            } else if (context.startsWith('generic.')) {
                const cleanContext = context.replace('generic.', '');
                const lastUnderscore = cleanContext.lastIndexOf('_');
                const parentPath = cleanContext.substring(0, lastUnderscore);
                const itemIdx = parseInt(cleanContext.substring(lastUnderscore + 1));
                
                const firstUnderscore = parentPath.indexOf('_');
                const category = parentPath.substring(0, firstUnderscore);
                const classId = parentPath.substring(firstUnderscore + 1);
                
                if (state[category] && state[category][classId] && state[category][classId][itemIdx]) {
                    state[category][classId][itemIdx].media.splice(idx, 1);
                    state[`idx_${context}`] = 0;
                }
            }
            triggerSave();
            renderApp();
        }

        // ==========================================
        // NEW IMGBB FREE CLOUD UPLOAD SYSTEM
        // ==========================================
        function uploadImageToWeb(file, callback) {
            if (!IMGBB_API_KEY || IMGBB_API_KEY === "PASTE_YOUR_IMGBB_KEY_HERE") {
                alert("Please paste your ImgBB API Key in the code first!");
                return;
            }

            showToast("Uploading image... Please wait ⏳", "fa-spinner fa-spin", "text-amber-400");
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    // Compress image slightly to save user bandwidth
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200;
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Convert to base64 string, remove the metadata prefix for ImgBB
                    const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
                    
                    const formData = new FormData();
                    formData.append('image', base64Image);
                    
                    fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: 'POST',
                        body: formData
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            showToast("Image Uploaded & Saved! ✅", "fa-circle-check", "text-emerald-400");
                            callback(data.data.url); // Returns the tiny URL
                        } else {
                            throw new Error("ImgBB API rejected the upload");
                        }
                    })
                    .catch(err => {
                        console.error("ImgBB Error:", err);
                        alert("Upload Failed. Check your internet connection or API Key.");
                        showToast("Upload Failed", "fa-triangle-exclamation", "text-rose-500");
                    });
                };
            };
        }

        function handleProfilePicUpload(e) {
            if(e.target.files[0]) {
                uploadImageToWeb(e.target.files[0], res => { 
                    state.profile.pic = res; 
                    triggerSave(); 
                    renderApp(); 
                });
            }
        }

        function handleMediaUpload(e, type, cId, sId, pIdx) {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            files.forEach(file => {
                uploadImageToWeb(file, res => {
                    if (type === 'about.media') state.about.media.push(res);
                    else if (type === 'project') {
                        const p = state.classes.find(c => c.id === cId).subjects.find(s => s.id === sId).projects[pIdx];
                        if(!p.media) p.media = [];
                        p.media.push(res);
                    }
                    triggerSave();
                    renderApp();
                });
            });
        }

        function handleGenericMediaUpload(e, category, classId, itemIdx) {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            files.forEach(file => {
                uploadImageToWeb(file, res => {
                    const item = state[category][classId][itemIdx];
                    if(!item.media) item.media = [];
                    item.media.push(res);
                    triggerSave();
                    renderApp();
                });
            });
        }

        function handleFeedUpload(e, category, classId) {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            files.forEach(file => {
                uploadImageToWeb(file, res => {
                    if(!state[category]) state[category] = {};
                    if(!state[category][classId]) state[category][classId] = [];
                    state[category][classId].unshift({ type: 'img', url: res, desc: '', media: [res] });
                    triggerSave();
                    renderApp();
                });
            });
        }

        function addAboutVideo() {
            const url = prompt("Paste YouTube URL or Shorts Link:");
            if(!url) return;
            let embedUrl = url;
            if(url.includes('watch?v=')) embedUrl = url.replace('watch?v=', 'embed/');
            else if(url.includes('youtu.be/')) embedUrl = url.replace('youtu.be/', 'youtube.com/embed/');
            else if(url.includes('shorts/')) embedUrl = url.replace('shorts/', 'embed/');

            state.about.media.push({ type: 'video', url: embedUrl });
            triggerSave();
            renderApp();
        }

        function addClass() {
            const name = prompt("Enter new Grade/Class Name (e.g., Grade 7 (2027-28)):");
            if (!name) return;
            
            const newId = 'class_' + Date.now();
            state.classes.unshift({ id: newId, name: name, year: '', subjects: [] });
            
            ['extracurriculars', 'hobbies', 'achievements', 'photoFeed'].forEach(cat => {
                if (!state[cat]) state[cat] = {};
                state[cat][newId] = [];
            });
            
            triggerSave();
            renderApp();
            showToast("New Grade Added Successfully!", "fa-circle-check", "text-emerald-400");
        }

        function addSubject(classId) {
            const cls = state.classes.find(c => c.id === classId);
            cls.subjects.push({ id: 'sub_' + Date.now(), name: 'New Subject', description: '', projects: [] });
            triggerSave();
            renderApp();
        }

        function addProjectCard(cId, sId) {
            const sub = state.classes.find(c => c.id === cId).subjects.find(s => s.id === sId);
            if(!sub.projects) sub.projects = [];
            sub.projects.unshift({ title: 'New Project', desc: '', media: [] });

        }

        function removeProjectCard(cId, sId, idx) {
            if(confirm('Are you sure you want to remove this project?')) {
                state.classes.find(c => c.id === cId).subjects.find(s => s.id === sId).projects.splice(idx, 1);
                triggerSave();
                renderApp();
            }
        }

        function addGenericItem(category, classId) {
            if(!state[category]) state[category] = {};
            if(!state[category][classId]) state[category][classId] = [];
            state[category][classId].unshift({ title: 'New Item', desc: '', media: [] });
            triggerSave();
            renderApp();
        }

        function removeGenericItem(category, classId, idx) {
            if(confirm('Are you sure you want to remove this item?')) {
                state[category][classId].splice(idx, 1);
                triggerSave();
                renderApp();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Force About Me as the default landing view
            if (!state.currentView || state.currentView === 'subject' || state.currentView === 'category') {
                state.currentView = 'about';
            }
            renderApp();
