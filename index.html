    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .edit-controls-flex { display: none !important; }
        .edit-controls-block { display: none !important; }
        body.edit-mode .edit-controls-flex { display: flex !important; }
        body.edit-mode .edit-controls-block { display: block !important; }
        
        body:not(.edit-mode) .editable-border { border: 1px solid transparent !important; pointer-events: none; }
        body.edit-mode .editable-border { border: 1px dashed #94a3b8 !important; border-radius: 0.5rem; transition: all 0.2s; }
        body.edit-mode .editable-border:focus { border-color: #2563eb !important; background: #f8fafc; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        body:not(.edit-mode) textarea:placeholder-shown,
        body:not(.edit-mode) input:placeholder-shown,
        body:not(.edit-mode) .hide-if-empty:empty,
        body:not(.edit-mode) .hide-if-no-media:not(:has(img)):not(:has(iframe)) { display: none !important; }

        #app-sidebar { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        #app-sidebar.collapsed { width: 5.5rem; }
        #app-sidebar.collapsed .hide-on-collapse { display: none; opacity: 0; }
        #app-sidebar.collapsed .center-on-collapse { justify-content: center; padding-left: 0; padding-right: 0; }
        
        @media (max-width: 767px) {
            #app-sidebar { position: absolute; left: 0; top: 0; transform: translateX(-100%); width: 85vw !important; max-width: 320px; z-index: 50; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
            #app-sidebar.mobile-open { transform: translateX(0); }
            #app-sidebar .hide-on-collapse { display: block; opacity: 1; }
            #app-sidebar.collapsed { width: 85vw !important; }
            .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.4); z-index: 40; backdrop-filter: blur(3px); }
            .mobile-overlay.show { display: block; }
        }

        #toast-notification { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; transform: translateY(100px); opacity: 0; z-index: 99999; }
        #toast-notification.show { transform: translateY(0); opacity: 1; }

        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .wave-emoji { display: inline-block; animation: wave 2.5s infinite; transform-origin: 70% 70%; }
        @keyframes wave { 0% { transform: rotate( 0.0deg) } 10% { transform: rotate(14.0deg) } 20% { transform: rotate(-8.0deg) } 30% { transform: rotate(14.0deg) } 40% { transform: rotate(-4.0deg) } 50% { transform: rotate(10.0deg) } 60% { transform: rotate( 0.0deg) } 100% { transform: rotate( 0.0deg) } }

        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .tree-line { position: relative; }
        .tree-line::before { content: ''; position: absolute; left: 19px; top: 0; bottom: 0; width: 2px; background: #e2e8f0; border-radius: 2px; z-index: 0; }
        .tree-item { position: relative; z-index: 1; }
    </style>
</head>

<body class="text-slate-800 flex h-screen overflow-hidden bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-100 via-slate-50 to-white selection:bg-blue-200">

    <!-- Global Loader with Guaranteed Timeout -->
    <div id="global-loader" class="fixed inset-0 bg-slate-50 z-[99999] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-16 h-16 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin shadow-sm"></div>
        <p class="mt-4 font-bold text-slate-600 tracking-wide text-sm animate-pulse">Loading Portfolio...</p>
    </div>

    <!-- Mobile Overlay -->
    <div id="mobile-sidebar-overlay" class="mobile-overlay" onclick="toggleMobileMenu()"></div>

    <!-- Toast Notification -->
    <div id="toast-notification" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 text-sm font-medium border border-slate-700">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">Action successful</span>
    </div>

    <!-- Sidebar -->
    <aside id="app-sidebar" class="glass-card border-r border-slate-200/50 flex flex-col w-[20rem] flex-shrink-0 relative shadow-[4px_0_24px_rgba(37,99,235,0.05)] z-40">
        
        <!-- Profile Section -->
        <div class="p-6 pb-4 flex flex-col items-center border-b border-slate-100/50 relative group">
            <button onclick="toggleSidebarCollapse()" class="hidden md:flex absolute -right-3.5 top-10 bg-white border border-blue-100 text-blue-500 hover:text-blue-700 hover:bg-blue-50 w-7 h-7 rounded-full items-center justify-center shadow-md z-10 transition-all">
                <i class="fa-solid fa-chevron-left text-[10px]" id="collapse-icon"></i>
            </button>
            
            <div class="relative cursor-pointer transition-transform hover:scale-105" onclick="handleThumbnailClick()">
                <img id="sidebar-profile-pic" src="https://ui-avatars.com/api/?name=Amaira+Mulay&background=bfdbfe&color=1e3a8a" class="w-16 h-16 rounded-2xl object-cover shadow-lg border-2 border-white" alt="Amaira">
                <div class="edit-controls-flex absolute inset-0 bg-black/40 rounded-2xl items-center justify-center opacity-0 group-hover:opacity-100 transition">
                    <i class="fa-solid fa-camera text-white text-sm"></i>
                </div>
            </div>
            <input type="file" id="profile_pic_input" class="hidden" accept="image/*" onchange="handleProfilePicUpload(event)">
            
            <div class="mt-3 text-center hide-on-collapse w-full min-w-0">
                <textarea rows="1" data-field="profile.name" class="w-full text-center text-lg font-extrabold text-slate-900 bg-transparent editable-border p-1 resize-none overflow-hidden" placeholder="Name">Amaira Mulay</textarea>
                <textarea rows="1" data-field="profile.grade" class="w-full text-center text-[10px] font-bold text-blue-600 uppercase tracking-widest bg-transparent editable-border p-0.5 resize-none overflow-hidden mt-0.5" placeholder="Grade">Class 6 • NVS</textarea>
            </div>
        </div>

        <!-- Navigation Menu (Dynamic Tree) -->
        <nav class="flex-1 overflow-y-auto p-4 space-y-4 scroll-smooth hide-scrollbar" id="sidebar-nav"></nav>

        <!-- Minimal Footer with Lock Icon -->
        <div class="p-4 border-t border-slate-100/50 bg-slate-50/50 flex justify-between items-center hide-on-collapse">
            <span class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">Amaira's Portfolio</span>
            <button onclick="handleAdminLoginToggle()" id="admin-lock-btn" class="p-2 text-slate-400 hover:text-blue-500 hover:bg-blue-50 rounded-lg transition-all" title="Admin Login">
                <i class="fa-solid fa-lock text-sm"></i>
            </button>
        </div>
        <div class="p-4 border-t border-slate-100/50 bg-slate-50/50 flex justify-center items-center center-on-collapse md:hidden" id="admin-lock-btn-mobile">
            <button onclick="handleAdminLoginToggle()" class="p-2 text-slate-400 hover:text-blue-500 rounded-lg transition-all"><i class="fa-solid fa-lock text-sm"></i></button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative min-w-0">
        
        <!-- Breadcrumb Header (Site Map) -->
        <header class="h-16 glass-card border-b border-slate-200/50 px-4 md:px-6 flex items-center justify-between flex-shrink-0 z-10 relative">
            <div class="flex items-center space-x-3 min-w-0 flex-1">
                <button onclick="toggleMobileMenu()" class="md:hidden flex items-center justify-center w-10 h-10 text-slate-600 hover:bg-blue-50 hover:text-blue-600 rounded-xl transition flex-shrink-0">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                
                <!-- Breadcrumbs -->
                <div class="flex items-center space-x-2 text-xs md:text-sm font-semibold text-slate-500 overflow-x-auto hide-scrollbar whitespace-nowrap" id="breadcrumb-container">
                    <!-- Injected by JS -->
                </div>
            </div>
            
            <div class="flex items-center space-x-3 edit-controls-flex flex-shrink-0 ml-4">
                <span class="text-[10px] md:text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full border border-blue-200 flex items-center space-x-1.5 shadow-sm">
                    <i class="fa-solid fa-cloud-arrow-up"></i><span class="hidden sm:inline">Synced</span>
                </span>
            </div>
        </header>

        <!-- Dynamic Viewport -->
        <div id="main-content-viewport" class="flex-1 overflow-y-auto overflow-x-hidden p-4 md:p-8 lg:p-10 fade-in scroll-smooth">
            <!-- Content Injected via JS -->
        </div>
    </main>

    <script>
        let state = {
            isEditMode: false,
            isSidebarCollapsed: false,
            currentView: 'about',
            activeIds: { sectionId: null, classId: null, subjectId: null, category: null },
            collapsedMenus: { sections: {}, categories: {}, classes: {} },
            
            profile: { name: 'Amaira Mulay', grade: 'Class 6 • NVS', pic: '' },
            about: { 
                title: 'Hello! I am Amaira.', 
                subtitle: 'Welcome to my digital portfolio!', 
                bio: 'I am an enthusiastic 6th-grade student at Nath Valley School in Chhatrapati Sambhajinagar. I love exploring the wonders of Science, participating in school activities, and learning new skills every day! I hope you like my digital portfolio, which will give you a brief about my academics as well as my extra-curricular activities and hobbies.',
                media: [] 
            },
            
            sections: [
                { id: 'sec_acad', title: 'Academics', isAcademic: true },
                { id: 'sec_beyond', title: 'Beyond Academics', isAcademic: false, categories: ['extracurriculars', 'hobbies', 'achievements', 'photoFeed'] }
            ],
            
            classes: [
                {
                    id: 'class_6', name: 'Class 6 (2026-27)', year: '2026-2027',
                    subjects: [{ id: 'sub_science', name: 'Science & MDP', description: 'Exploring the world of Science.', projects: [] }]
                }
            ],
            categoryNames: {
                extracurriculars: 'Extracurriculars',
                hobbies: 'Hobbies & Skills',
                achievements: 'Achievements',
                photoFeed: 'My Memories'
            }
        };

        const DOC_ID = "AMAIRA_PORTFOLIO_MASTER_DATA_V4";

        window.addEventListener('DOMContentLoaded', () => {
            if (!state.currentView || state.currentView === 'subject' || state.currentView === 'category') {
                state.currentView = 'about';
            }
            
            if (typeof auth !== 'undefined') {
                auth.onAuthStateChanged(user => {
                    if (user) {
                        state.isEditMode = true;
                    } else {
                        state.isEditMode = false;
                    }
                    updateEditModeUI();
                    
                    const loader = document.getElementById('global-loader');
                    if(loader && loader.style.display === 'none') {
                        renderApp();
                    }
                });
            }
            
            loadFromFirebase();
        });

        async function loadFromFirebase() {
            try {
                const docRef = db.collection('portfolioData').doc(DOC_ID);
                const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Firebase Timeout')), 4000));
                const docSnap = await Promise.race([docRef.get(), timeoutPromise]);

                if (docSnap && docSnap.exists) {
                    let dbData = docSnap.data();
                    
                    delete dbData.currentView;
                    delete dbData.activeIds;
                    delete dbData.isEditMode;
                    delete dbData.isSidebarCollapsed;

                    if (!dbData.sections) {
                        dbData.sections = [
                            { id: 'sec_acad', title: 'Academics', isAcademic: true },
                            { id: 'sec_beyond', title: 'Beyond Academics', isAcademic: false, categories: ['extracurriculars', 'hobbies', 'achievements', 'photoFeed'] }
                        ];
                    }

                    const categoriesList = [];
                    dbData.sections.forEach(s => { if(!s.isAcademic && s.categories) categoriesList.push(...s.categories); });
                    
                    categoriesList.forEach(cat => {
                        if (dbData[cat] && Array.isArray(dbData[cat])) {
                            let migrated = {};
                            const defaultClassId = dbData.classes && dbData.classes.length > 0 ? dbData.classes[0].id : 'class_6';
                            migrated[defaultClassId] = dbData[cat];
                            dbData[cat] = migrated;
                        }
                    });

                    state = { ...state, ...dbData };
                }
            } catch (e) {
                console.warn("Loading from local fallback state due to network/timeout:", e);
            } finally {
                state.currentView = 'about';
                renderApp(); 
                const loader = document.getElementById('global-loader');
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => { if(loader) loader.style.display = 'none'; }, 400);
                }
            }
        }

        let saveTimeout;
        function triggerSave() {
            if (!auth.currentUser) return; 
            clearTimeout(saveTimeout);
            
            const syncBadge = document.querySelector('header .edit-controls-flex span');
            if(syncBadge) syncBadge.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span class="hidden sm:inline">Saving...</span>`;

            saveTimeout = setTimeout(async () => { 
                try { 
                    await db.collection('portfolioData').doc(DOC_ID).set(state); 
                    if(syncBadge) syncBadge.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i><span class="hidden sm:inline">Synced</span>`;
                } catch (e) { 
                    console.error("Cloud Save Error:", e);
                    if(syncBadge) syncBadge.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-500"></i><span class="hidden sm:inline text-rose-500">Failed</span>`;
                }
            }, 500);
        }

        async function handleAdminLoginToggle() {
            if (auth.currentUser) {
                await auth.signOut();
                showToast("Logged out successfully");
            } else {
                const email = prompt("Admin Email:");
                if(!email) return;
                const pass = prompt("Admin Password:");
                if(!pass) return;
                try {
                    await auth.signInWithEmailAndPassword(email, pass);
                    showToast("Admin access granted");
                } catch (e) {
                    showToast("Login failed: " + e.message);
                }
            }
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('app-sidebar');
            const overlay = document.getElementById('mobile-sidebar-overlay');
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('show');
        }

        function toggleSidebarCollapse() {
            state.isSidebarCollapsed = !state.isSidebarCollapsed;
            const sidebar = document.getElementById('app-sidebar');
            const icon = document.getElementById('collapse-icon');
            sidebar.classList.toggle('collapsed', state.isSidebarCollapsed);
            icon.className = state.isSidebarCollapsed ? "fa-solid fa-chevron-right text-[10px]" : "fa-solid fa-chevron-left text-[10px]";
            renderSidebarNav();
        }

        function handleThumbnailClick() {
            if (state.isSidebarCollapsed && window.innerWidth >= 768) toggleSidebarCollapse(); 
            else if (auth.currentUser) document.getElementById('profile_pic_input').click();
        }

        function handleIconClick(e, actionFn) {
            if (state.isSidebarCollapsed && window.innerWidth >= 768) toggleSidebarCollapse();
            actionFn();
        }

        function toggleMenuSection(type, id) {
            if (state.isSidebarCollapsed && window.innerWidth >= 768) toggleSidebarCollapse();
            state.collapsedMenus[type][id] = !state.collapsedMenus[type][id];
            renderSidebarNav();
        }

        function switchView(viewName, sectionId = null, classId = null, subjectId = null, category = null) {
            state.currentView = viewName;
            state.activeIds = { sectionId, classId, subjectId, category };
            if (window.innerWidth < 768) {
                document.getElementById('app-sidebar').classList.remove('mobile-open');
                document.getElementById('mobile-sidebar-overlay').classList.remove('show');
            }
            renderApp();
        }

        function updateEditModeUI() {
            document.body.classList.toggle('edit-mode', state.isEditMode);
            const lockBtn = document.getElementById('admin-lock-btn');
            const lockBtnMobile = document.getElementById('admin-lock-btn-mobile');
            const iconClass = auth.currentUser ? "fa-solid fa-lock-open text-emerald-500" : "fa-solid fa-lock text-slate-400";
            if(lockBtn) lockBtn.innerHTML = `<i class="${iconClass} text-sm"></i>`;
            if(lockBtnMobile) lockBtnMobile.innerHTML = `<button onclick="handleAdminLoginToggle()" class="p-2 hover:bg-blue-50 rounded-lg transition"><i class="${iconClass} text-sm"></i></button>`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function resizeAllTextareas() {
            document.querySelectorAll('textarea[data-field]').forEach(el => {
                el.style.height = 'auto';
                el.style.height = el.scrollHeight + 'px';
            });
        }

        function attachInputListeners() {
            document.querySelectorAll('textarea[data-field], input[data-field]').forEach(input => {
                if(input.tagName === 'TEXTAREA') {
                    input.addEventListener('input', function() { 
                        this.style.height = 'auto';
                        this.style.height = this.scrollHeight + 'px'; 
                    });
                }
                input.addEventListener('input', (e) => {
                    if (!auth.currentUser) return;
                    const field = e.target.dataset.field;
                    const val = e.target.value;
                    const ids = e.target.dataset.ids ? e.target.dataset.ids.split(',') : [];

                    if (field.startsWith('profile.')) state.profile[field.split('.')[1]] = val;
                    else if (field.startsWith('about.')) state.about[field.split('.')[1]] = val;
                    else if (field === 'section.title') state.sections.find(s => s.id === ids[0]).title = val;
                    else if (field === 'class.name') state.classes.find(c => c.id === ids[0]).name = val;
                    else if (field === 'subject.name') state.classes.find(c => c.id === ids[0]).subjects.find(s => s.id === ids[1]).name = val;
                    else if (field === 'subject.desc') state.classes.find(c => c.id === ids[0]).subjects.find(s => s.id === ids[1]).description = val;
                    else if (field === 'project.title') state.classes.find(c => c.id === ids[0]).subjects.find(s => s.id === ids[1]).projects[ids[2]].title = val;
                    else if (field === 'project.desc') state.classes.find(c => c.id === ids[0]).subjects.find(s => s.id === ids[1]).projects[ids[2]].desc = val;
                    else if (field === 'category.name') state.categoryNames[ids[0]] = val;
                    else if (field === 'generic.title') state[ids[0]][ids[1]][ids[2]].title = val;
                    else if (field === 'generic.desc') state[ids[0]][ids[1]][ids[2]].desc = val;
                    
                    document.querySelectorAll(`[data-sync="${field}_${ids.join('_')}"]`).forEach(el => el.innerText = val);
                    triggerSave();
                });
            });
        }

        function renderBreadcrumbs() {
            const bc = document.getElementById('breadcrumb-container');
            const firstName = state.profile.name.split(' ')[0] || 'Amaira';
            let html = `<span class="cursor-pointer hover:text-blue-600 transition" onclick="switchView('about')"><i class="fa-solid fa-house text-[10px] mr-1"></i>${firstName}</span>`;
            
            if (state.currentView === 'subject') {
                const sec = state.sections.find(s => s.id === state.activeIds.sectionId) || {title: 'Academics'};
                const cls = state.classes.find(c => c.id === state.activeIds.classId);
                const sub = cls.subjects.find(s => s.id === state.activeIds.subjectId);
                html += `<span class="mx-2 text-slate-300">/</span><span class="cursor-pointer hover:text-blue-600 transition" onclick="handleIconClick(event, () => toggleMenuSection('sections', '${sec.id}'))">${sec.title}</span>`;
                html += `<span class="mx-2 text-slate-300">/</span><span class="cursor-pointer hover:text-blue-600 transition" onclick="handleIconClick(event, () => toggleMenuSection('classes', '${cls.id}'))">${cls.name}</span>`;
                html += `<span class="mx-2 text-slate-300">/</span><span class="text-slate-800 font-bold">${sub.name}</span>`;
            } else if (state.currentView === 'category') {
                const sec = state.sections.find(s => s.id === state.activeIds.sectionId) || {title: 'Beyond Academics'};
                const catName = state.categoryNames[state.activeIds.category];
                const cls = state.classes.find(c => c.id === state.activeIds.classId);
                html += `<span class="mx-2 text-slate-300">/</span><span class="cursor-pointer hover:text-blue-600 transition" onclick="handleIconClick(event, () => toggleMenuSection('sections', '${sec.id}'))">${sec.title}</span>`;
                html += `<span class="mx-2 text-slate-300">/</span><span class="cursor-pointer hover:text-blue-600 transition" onclick="handleIconClick(event, () => toggleMenuSection('categories', '${state.activeIds.category}'))">${catName}</span>`;
                html += `<span class="mx-2 text-slate-300">/</span><span class="text-slate-800 font-bold">${cls.name}</span>`;
            } else {
                html += `<span class="mx-2 text-slate-300">/</span><span class="text-slate-800 font-bold">About Me</span>`;
            }
            bc.innerHTML = html;
        }

        function renderSidebarNav() {
            const nav = document.getElementById('sidebar-nav');
            let html = `
                <div onclick="handleIconClick(event, () => switchView('about'))" class="flex items-center space-x-3 p-3 rounded-xl cursor-pointer transition ${state.currentView === 'about' ? 'bg-blue-600 shadow-md text-white font-bold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'} center-on-collapse mb-4">
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 ${state.currentView === 'about' ? 'text-white' : 'bg-white shadow-sm text-slate-500'}"><i class="fa-solid fa-user text-sm"></i></div>
                    <span class="text-sm truncate hide-on-collapse">About Me</span>
                </div>
            `;

            state.sections.forEach(sec => {
                const isSecCollapsed = state.collapsedMenus['sections'][sec.id];
                
                html += `
                    <div class="mt-4 mb-1 group relative">
                        <div class="flex items-center justify-between px-3 cursor-pointer hide-on-collapse" onclick="handleIconClick(event, () => toggleMenuSection('sections', '${sec.id}'))">
                            <div class="flex items-center w-full min-w-0 pr-2">

                                        <div class="flex items-start space-x-2">
                                            <span class="font-bold text-sm text-slate-900 pt-1">${state.profile.name.split(' ')[0]}</span>
                                            <textarea rows="2" data-field="generic.desc" data-ids="${category},${classId},${idx}" class="w-full text-sm font-medium text-slate-700 bg-transparent editable-border py-1 resize-none hide-if-empty min-w-0" placeholder="Write a caption...">${item.desc || ''}</textarea>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="max-w-6xl mx-auto space-y-8 min-w-0 pb-10">
                    <div class="glass-card rounded-[2rem] shadow-sm overflow-hidden bg-white">
                        <div class="bg-gradient-to-r from-indigo-50 to-purple-50/50 p-6 md:p-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-indigo-100/50">
                            <textarea rows="1" data-field="category.name" data-ids="${category}" class="w-full text-3xl font-extrabold text-slate-900 bg-transparent editable-border py-1 resize-none overflow-hidden min-w-0">${catName}</textarea>
                            <button onclick="addGenericItem('${category}', '${classId}')" class="edit-controls-flex bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-6 py-3 rounded-2xl text-sm font-bold flex-shrink-0 shadow-lg hover:shadow-xl transition-all"><i class="fa-solid fa-plus mr-2"></i>Add Item</button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
                        ${items.map((item, idx) => `
                            <div class="glass-card rounded-[2rem] p-8 shadow-sm hover:shadow-md transition-shadow min-w-0 bg-white border border-slate-100">
                                <div class="flex items-start justify-between gap-4 min-w-0">
                                    <textarea rows="2" data-field="generic.title" data-ids="${category},${classId},${idx}" class="w-full font-extrabold text-slate-900 text-xl md:text-2xl bg-transparent editable-border py-1 resize-none overflow-hidden leading-tight min-w-0" placeholder="Title">${item.title}</textarea>
                                    <button onclick="removeGenericItem('${category}', '${classId}', ${idx})" class="edit-controls-flex text-rose-500 bg-rose-50 hover:bg-rose-100 p-3 rounded-xl flex-shrink-0 transition"><i class="fa-solid fa-trash"></i></button>
                                </div>
                                <textarea rows="4" data-field="generic.desc" data-ids="${category},${classId},${idx}" class="w-full text-base font-medium text-slate-600 bg-transparent editable-border py-1 mt-3 resize-none hide-if-empty min-w-0" placeholder="Description...">${item.desc || ''}</textarea>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCarousel(mediaArr, context, inputId) {
            if (!mediaArr || mediaArr.length === 0) {
                return `
                    <div class="edit-controls-flex w-full h-full min-h-[250px] border-2 border-dashed border-blue-200 rounded-[2rem] md:rounded-l-[2.5rem] md:rounded-r-none items-center justify-center bg-blue-50/50 cursor-pointer hover:bg-blue-50 transition m-4 mx-auto max-w-[90%]" onclick="document.getElementById('${inputId}').click()">
                        <div class="text-center text-blue-400"><i class="fa-solid fa-cloud-arrow-up text-4xl mb-3"></i><p class="text-sm font-bold">Upload Photos or Add Video</p></div>
                    </div>`;
            }

            const currentIdx = state[`idx_${context}`] || 0;
            const currentItem = mediaArr[currentIdx];
            const safeImages = JSON.stringify(mediaArr).replace(/"/g, "&quot;");
            
            let mediaDisplayHtml = '';
            if (typeof currentItem === 'object' && currentItem.type === 'video') {
                mediaDisplayHtml = `<iframe class="absolute inset-0 w-full h-full object-cover" src="${currentItem.url}" frameborder="0" allowfullscreen></iframe>`;
            } else {
                const imgSrc = typeof currentItem === 'string' ? currentItem : currentItem.url;
                mediaDisplayHtml = `
                    <div class="absolute inset-0 w-full h-full flex items-center justify-center overflow-hidden bg-slate-900">
                        <div class="absolute inset-0 bg-cover bg-center blur-2xl opacity-40 scale-125" style="background-image: url('${imgSrc}')"></div>
                        <img src="${imgSrc}" class="carousel-img relative max-w-full max-h-full object-contain z-10 p-3 transition-all duration-700 ease-in-out">
                    </div>
                `;
            }

            return `
                <div class="carousel-container relative w-full h-full min-h-[300px] md:min-h-full group rounded-t-[2.5rem] md:rounded-l-[2.5rem] md:rounded-tr-none overflow-hidden bg-slate-900" data-context="${context}" data-images="${safeImages}" data-index="${currentIdx}" data-input="${inputId}">
                    ${mediaDisplayHtml}
                    <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
                    
                    <div class="edit-controls-flex absolute top-4 right-4 space-x-2 z-10">
                        <button onclick="document.getElementById('${inputId}').click()" class="bg-white text-blue-600 w-10 h-10 rounded-xl shadow-lg flex items-center justify-center hover:scale-105 transition" title="Add Photo"><i class="fa-solid fa-camera text-sm"></i></button>
                        <button onclick="removeMedia('${context}')" class="bg-white text-rose-500 w-10 h-10 rounded-xl shadow-lg flex items-center justify-center hover:scale-105 transition" title="Remove"><i class="fa-solid fa-trash text-sm"></i></button>
                    </div>
                    
                    ${mediaArr.length > 1 ? `
                        <button onclick="manualChangeSlide('${context}', -1)" class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/40 text-white w-10 h-10 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition backdrop-blur-md hover:bg-black/60 z-10"><i class="fa-solid fa-chevron-left text-sm"></i></button>
                        <button onclick="manualChangeSlide('${context}', 1)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/40 text-white w-10 h-10 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition backdrop-blur-md hover:bg-black/60 z-10"><i class="fa-solid fa-chevron-right text-sm"></i></button>
                        <div class="carousel-dots absolute bottom-6 left-0 right-0 flex justify-center space-x-2 z-10">
                            ${mediaArr.map((_, i) => `<div class="carousel-dot w-2 h-2 rounded-full transition-all duration-300 ${i === currentIdx ? 'bg-white scale-125' : 'bg-white/40'}" data-index="${i}"></div>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        setInterval(() => {
            if(state.isEditMode) return;
            document.querySelectorAll('.carousel-container').forEach(container => {
                try {
                    const imagesStr = container.getAttribute('data-images');
                    if(!imagesStr) return;
                    
                    const images = JSON.parse(imagesStr.replace(/&quot;/g, '"'));
                    if (images.length > 1) {
                        let idx = parseInt(container.getAttribute('data-index'));
                        idx = (idx + 1) % images.length;
                        
                        container.setAttribute('data-index', idx);
                        const currentItem = images[idx];
                        const inputId = container.getAttribute('data-input') || 'temp_input';
                        
                        if (typeof currentItem === 'object' && currentItem.type === 'video') {
                            container.outerHTML = renderCarousel(images, container.getAttribute('data-context'), inputId);
                        } else {
                            const imgEl = container.querySelector('.carousel-img');
                            if(imgEl) {
                                imgEl.style.opacity = '0.7';
                                setTimeout(() => {
                                    imgEl.src = typeof currentItem === 'string' ? currentItem : currentItem.url;
                                    imgEl.style.opacity = '1';
                                    
                                    const blurBg = container.querySelector('.bg-cover');
                                    if(blurBg) blurBg.style.backgroundImage = `url('${imgEl.src}')`;
                                }, 150);
                            } else {
                                container.outerHTML = renderCarousel(images, container.getAttribute('data-context'), inputId);
                            }
                        }
                        
                        const dots = container.querySelectorAll('.carousel-dot');
                        dots.forEach((dot, i) => {
                            dot.className = `carousel-dot w-2 h-2 rounded-full transition-all duration-300 ${i === idx ? 'bg-white scale-125' : 'bg-white/40'}`;
                        });
                        
                        const context = container.getAttribute('data-context');
                        state[`idx_${context}`] = idx;
                    }
                } catch(e) { console.error("Slideshow error", e); }
            });
        }, 5000);

        function manualChangeSlide(context, dir) {
            const el = document.querySelector(`[data-context="${context}"]`);
            if(!el) return;
            const images = JSON.parse(el.getAttribute('data-images').replace(/&quot;/g, '"'));
            const inputId = el.getAttribute('data-input') || 'temp_input';
            
            let curr = state[`idx_${context}`] || 0;
            curr = (curr + dir + images.length) % images.length;
            state[`idx_${context}`] = curr;
            
            el.outerHTML = renderCarousel(images, context, inputId);
        }

        function removeMedia(context) {
            const idx = state[`idx_${context}`] || 0;
            if (context === 'about.media') {
                state.about.media.splice(idx, 1);
                state['idx_about.media'] = 0;
            } else if (context.startsWith('project.')) {
                const cleanContext = context.replace('project.', '');
                const lastUnderscore = cleanContext.lastIndexOf('_');
                const parentPath = cleanContext.substring(0, lastUnderscore); 
                const pIdx = parseInt(cleanContext.substring(lastUnderscore + 1));
                
                const firstUnderscore = parentPath.indexOf('_');
                const classId = parentPath.substring(0, firstUnderscore);
                const subjectId = parentPath.substring(firstUnderscore + 1);
                
                const cls = state.classes.find(c => c.id === classId);
                if (cls) {
                    const sub = cls.subjects.find(s => s.id === subjectId);
                    if (sub && sub.projects && sub.projects[pIdx]) {
                        sub.projects[pIdx].media.splice(idx, 1);
                        state[`idx_${context}`] = 0;
                    }
                }
            }
            triggerSave();
            renderApp();
        }

        function toggleShortcut(e, key) {
            e.stopPropagation();
            const content = document.getElementById('shortcut-content-' + key);
            const icon = document.getElementById('shortcut-icon-' + key);
            if (content.style.maxHeight && content.style.maxHeight !== '0px') {
                content.style.maxHeight = '0px';
                icon.style.transform = 'rotate(0deg)';
                content.style.opacity = '0';
                content.classList.remove('border-slate-100');
                content.classList.add('border-transparent');
            } else {
                content.style.maxHeight = content.scrollHeight + 'px';
                icon.style.transform = 'rotate(180deg)';
                content.style.opacity = '1';
                content.classList.remove('border-transparent');
                content.classList.add('border-slate-100');
            }
        }

        function toggleShortcutClass(e, key) {
            e.stopPropagation();
            const content = document.getElementById('shortcut-class-content-' + key);
            const icon = document.getElementById('shortcut-class-icon-' + key);
            if (content.style.maxHeight && content.style.maxHeight !== '0px') {
                content.style.maxHeight = '0px';
                icon.style.transform = 'rotate(0deg)';
                content.style.opacity = '0';
            } else {
                content.style.maxHeight = content.scrollHeight + 'px';
                icon.style.transform = 'rotate(180deg)';
                content.style.opacity = '1';
                const parentCard = content.closest('[id^="shortcut-content-"]');
                if (parentCard) {
                    parentCard.style.maxHeight = (parentCard.scrollHeight + content.scrollHeight) + 'px';
                }
            }
        }

        function uploadImageToWeb(file, callback) {
            if (!IMGBB_API_KEY || IMGBB_API_KEY === "PASTE_YOUR_IMGBB_KEY_HERE") {
                showToast("Please add your ImgBB API Key first!");
                return;
            }

            const syncBadge = document.querySelector('header .edit-controls-flex span');
            if(syncBadge) syncBadge.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span class="hidden sm:inline">Uploading...</span>`;
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200;
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
                    const formData = new FormData();
                    formData.append('image', base64Image);
                    
                    fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            showToast("Image Uploaded!");
                            callback(data.data.url);
                        } else throw new Error("ImgBB API rejected");
                    })
                    .catch(err => {
                        console.error("ImgBB Error:", err);
                        showToast("Upload Failed. Check ImgBB Key.");
                        if(syncBadge) syncBadge.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-500"></i><span class="hidden sm:inline text-rose-500">Failed</span>`;
                    });
                };
            };
        }

        function handleProfilePicUpload(e) {
            if(e.target.files[0]) uploadImageToWeb(e.target.files[0], res => { state.profile.pic = res; triggerSave(); renderApp(); });
        }

        function handleMediaUpload(e, type, cId, sId, pIdx) {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            files.forEach(file => {
                uploadImageToWeb(file, res => {
                    if (type === 'about.media') state.about.media.push(res);
                    else if (type === 'project') {
                        const p = state.classes.find(c => c.id === cId).subjects.find(s => s.id === sId).projects[pIdx];
                        if(!p.media) p.media = [];
                        p.media.push(res);
                    }
                    triggerSave();
                    renderApp();
                });
            });
        }

        function handleFeedUpload(e, category, classId) {
            Array.from(e.target.files).forEach(file => {
                uploadImageToWeb(file, res => {
                    if(!state[category]) state[category] = {};
                    if(!state[category][classId]) state[category][classId] = [];
                    state[category][classId].unshift({ type: 'img', url: res, desc: '' });
                    triggerSave();
                    renderApp();
                });
            });
        }

        function addProjectVideo(cId, sId, pIdx) {
            const url = prompt("Paste YouTube URL or Shorts Link:");
            if(!url) return;
            let embedUrl = url;
            if(url.includes('watch?v=')) embedUrl = url.replace('watch?v=', 'embed/');
            else if(url.includes('youtu.be/')) embedUrl = url.replace('youtu.be/', 'youtube.com/embed/');
            else if(url.includes('shorts/')) embedUrl = url.replace('shorts/', 'embed/');

            const sub = state.classes.find(c => c.id === cId).subjects.find(s => s.id === sId);
            if(!sub.projects[pIdx].media) sub.projects[pIdx].media = [];
            
            sub.projects[pIdx].media.push({ type: 'video', url: embedUrl });
            triggerSave();
            renderApp();
        }

        function addFeedVideo(category, classId) {
            const url = prompt("Paste YouTube URL or Shorts Link:");
            if(!url) return;
            let embedUrl = url;
            if(url.includes('watch?v=')) embedUrl = url.replace('watch?v=', 'embed/');
            else if(url.includes('youtu.be/')) embedUrl = url.replace('youtu.be/', 'youtube.com/embed/');
            else if(url.includes('shorts/')) embedUrl = url.replace('shorts/', 'embed/');
            
            if(!state[category]) state[category] = {};
            if(!state[category][classId]) state[category][classId] = [];
            state[category][classId].unshift({ type: 'video', url: embedUrl, desc: '' });
            triggerSave();
            renderApp();
        }

        function addSection() {
            const name = prompt("Enter Name for New Main Section (e.g., 'Certificates', 'Travel'):");
            if (!name) return;
            const newId = 'sec_' + Date.now();
            state.sections.push({ id: newId, title: name, isAcademic: false, categories: [] });
            triggerSave(); renderApp();
            showToast("New Main Section Added!");
        }

        function removeSection(e, secId) {
            e.stopPropagation();
            state.sections = state.sections.filter(s => s.id !== secId);
            triggerSave(); renderApp();
            showToast("Section removed");
        }

        function addCategory(secId) {
            const name = prompt("Enter New Category Name (e.g., 'Robotics Club'):");
            if(!name) return;
            const newCatId = 'cat_' + Date.now();
            state.categoryNames[newCatId] = name;
            state[newCatId] = {};
            state.classes.forEach(cls => state[newCatId][cls.id] = []);
            
            const sec = state.sections.find(s => s.id === secId);
            if(!sec.categories) sec.categories = [];
            sec.categories.push(newCatId);
            triggerSave(); renderApp();
        }

        function removeCategory(e, secId, catId) {
            e.stopPropagation();
            const sec = state.sections.find(s => s.id === secId);
            if(sec && sec.categories) sec.categories = sec.categories.filter(c => c !== catId);
            triggerSave(); renderApp();
            showToast("Category removed");
        }

        function addClass() {
            const name = prompt("Enter new Grade/Class Name (e.g., Grade 7 (2027-28)):");
            if (!name) return;
            const newId = 'class_' + Date.now();
            state.classes.unshift({ id: newId, name: name, year: '', subjects: [] });
            
            state.sections.forEach(s => {
                if(!s.isAcademic && s.categories) {
                    s.categories.forEach(cat => {
                        if (!state[cat]) state[cat] = {};
                        state[cat][newId] = [];
                    });
                }
            });
            triggerSave(); renderApp();
            showToast("New Grade Added Successfully!");
        }

        function addSubject(classId) {
            const cls = state.classes.find(c => c.id === classId);
            cls.subjects.push({ id: 'sub_' + Date.now(), name: 'New Subject', description: '', projects: [] });
            triggerSave(); renderApp();
        }

        function addProjectCard(cId, sId) {
            const sub = state.classes.find(c => c.id === cId).subjects.find(s => s.id === sId);
            if(!sub.projects) sub.projects = [];
            sub.projects.unshift({ title: 'New Project', desc: '', media: [] });
            triggerSave(); renderApp();
        }

        function removeProjectCard(cId, sId, idx) {
            state.classes.find(c => c.id === cId).subjects.find(s => s.id === sId).projects.splice(idx, 1);
            triggerSave(); renderApp();
            showToast("Project removed");
        }

        function addGenericItem(category, classId) {
            if(!state[category]) state[category] = {};
            if(!state[category][classId]) state[category][classId] = [];
            state[category][classId].unshift({ title: 'New Item', desc: '' });
            triggerSave(); renderApp();
        }

        function removeGenericItem(category, classId, idx) {
            state[category][classId].splice(idx, 1);
            triggerSave(); renderApp();
            showToast("Item removed");
        }
    </script>
</body>
</html>
